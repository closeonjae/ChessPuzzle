[versions]
# Checked against Google Maven / Maven Central directly during implementation
# (2026-08) rather than assumed from memory — see RESEARCH.md 10-A/8절.
agp = "9.3.1"
kotlin = "2.4.10"
kotlinx-serialization-json = "1.11.0"
okhttp = "5.4.0"
chesslib = "1.3.7"
core-ktx = "1.19.0"
activity-compose = "1.13.0"
lifecycle-viewmodel-compose = "2.11.0"
datastore-preferences = "1.2.1"
wear-input = "1.2.0"
wear-phone-interactions = "1.1.1"
wear-compose = "1.6.2"
junit-jupiter = "5.11.4"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
chesslib = { module = "com.github.bhlangonijr:chesslib", version.ref = "chesslib" }

core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-viewmodel-compose" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore-preferences" }
wear-input = { module = "androidx.wear:wear-input", version.ref = "wear-input" }
wear-phone-interactions = { module = "androidx.wear:wear-phone-interactions", version.ref = "wear-phone-interactions" }
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wear-compose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wear-compose" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
